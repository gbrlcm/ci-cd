# ============================================================
# CD — Entrega Contínua (Cidades ESG Inteligentes / InovaGAB_API)
# Regras de deploy por branch:
#   branch develop -> staging  (http://SERVER:8081)
#   branch main    -> produção (http://SERVER:8080)
#
# O deploy usa SSH + Docker Compose no servidor.
# Para ativar o deploy, cadastre os GitHub Secrets:
#   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY (ver README).
# Sem secrets, o pipeline constrói/publica a imagem e sinaliza
# a necessidade de cadastro — não tenta inventar um deploy.
# ============================================================

name: CD

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy ${{ matrix.environment }} (${{ matrix.ref }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == matrix.ref
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - ref: develop
            environment: staging
          - ref: main
            environment: production
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Definir imagem (SHA do commit)
        id: meta
        run: |
          REPO_LOWERCASE="${GITHUB_REPOSITORY,,}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "image_full=${REGISTRY}/${REPO_LOWERCASE}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${REPO_LOWERCASE}:latest" >> "$GITHUB_OUTPUT"

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_full }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configurar agente SSH
        if: ${{ secrets.SERVER_HOST != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy em ${{ matrix.environment }} via SSH + Compose
        if: ${{ secrets.SERVER_HOST != '' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          bash scripts/deploy-remote.sh \
            "${{ matrix.environment }}" \
            "${{ steps.meta.outputs.image_full }}"

      # -------------------------------
      # Secrets ausentes -> orientação realista
      # -------------------------------
      - name: Deploy não executado (cadastre os secrets)
        if: ${{ secrets.SERVER_HOST == '' }}
        run: |
          echo "::warning::Deploy ${{ matrix.environment }} NÃO executado: secrets de servidor ausentes."
          echo "Para ativar, configure no GitHub > Settings > Secrets and variables > Actions:"
          echo "  SERVER_HOST  (ex.: 192.168.0.10)"
          echo "  SERVER_USER  (ex.: root)"
          echo "  SERVER_SSH_KEY (chave privada do servidor)"
          echo "A imagem ' ${{ steps.meta.outputs.image_full }} ' já foi publicada no GHCR."