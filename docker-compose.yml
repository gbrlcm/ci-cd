# ============================================================
# Docker Compose — Cidades ESG Inteligentes (InovaGAB_API)
# Ambiente local: aplicação Java Spring + MongoDB
# Uso:  cp .env.example .env  (opcional)  ->  docker compose up -d
# ============================================================

services:

  mongodb:
    image: mongo:7.0
    container_name: cidades-esg-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-inovagab_db}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cidades-esg-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    image: cidades-esg:local
    container_name: cidades-esg-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: "8080"
      # A aplicação acessa o banco pelo NOME do serviço (não localhost)
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DATABASE: ${MONGO_DATABASE:-inovagab_db}
      MONGO_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-secret}
      MONGO_AUTH_DB: ${MONGO_AUTH_DB:-admin}
      JWT_SECRET: ${JWT_SECRET:-my-dev-secret-for-jwt-generation-which-should-be-changed-in-production}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - cidades-esg-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  cidades-esg-network:
    driver: bridge

volumes:
  mongo_data:
    name: cidades-esg-mongo-data